{% extends "base.html" %}

{% block title %}Nouveau mot de passe{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <!-- Icône -->
    <div class="flex justify-center mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14 text-sky-600 dark:text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"/>
      </svg>
    </div>

    <!-- Titre -->
    <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">
      Nouveau mot de passe
    </h2>
    <p class="text-slate-500 text-center text-sm mb-8">
      Choisissez un nouveau mot de passe sécurisé
    </p>

    <!-- Formulaire -->
    <form method="post" class="space-y-5">
      {% csrf_token %}

      <!-- Nouveau mot de passe -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">
          Nouveau mot de passe
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input 
            type="password" 
            name="password" 
            required 
            minlength="8"
            placeholder="Nouveau mot de passe"
            class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          >
        </div>
      </div>

      <!-- Confirmation -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">
          Confirmer le mot de passe
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input 
            type="password" 
            name="password2" 
            required 
            minlength="8"
            placeholder="Confirmer le mot de passe"
            class="w-full pl-11 pr-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          >
        </div>
      </div>

      <!-- Bouton -->
      <button 
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200"
      >
        Changer mon mot de passe
      </button>
    </form>

  </div>
</div>
{% endblock %}
